name: Actualizar índice de cartas

# Se ejecuta al subir (o borrar) imágenes en img/cartas/. Regenera img/cartas/barajas.json (lo que lee la app)
# y la lista de la caché sin conexión (sw.js). Si una baraja está incompleta, el aviso sale en el registro de esta acción.
on:
  push:
    paths:
      - 'img/cartas/**/*.webp'
      - 'img/cartas/**/*.png'
      - 'img/cartas/**/*.jpg'
      - 'img/cartas/**/*.jpeg'
      - 'img/cartas/**/info.json'
      - 'img/cartas/dorsos/nombres.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar barajas.json y sw.js
        run: |
          python3 tools/generar_barajas.py
          python3 tools/generar_sw.py

      - name: Guardar cambios
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Acción automática: índice de cartas actualizado"
