<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juegos Reunidos</title>
<meta name="theme-color" content="#EEF2EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<body>
<header class="top">
  <button id="atras" class="icono" aria-label="Volver al inicio" hidden>‹</button>
  <h1 id="titulo">Juegos Reunidos</h1>
  <button id="mas" class="icono" aria-label="Menú del juego" hidden>⋯</button>
</header>
<main id="app"></main>
<nav id="nav" aria-label="Principal"></nav>
<noscript><p style="padding:16px">Juegos Reunidos necesita JavaScript.</p></noscript>
<script>
  // Los módulos JS no se cargan desde file:// (doble clic). Aviso claro en vez de pantalla en blanco.
  if (location.protocol === 'file:') document.getElementById('app').innerHTML =
    '<div style="padding:8px"><h2>Abre la app con un servidor</h2><p>Los módulos de JavaScript no funcionan al abrir index.html con doble clic.</p>' +
    '<p>En esta carpeta ejecuta <code>python -m http.server</code> y entra en <code>http://localhost:8000</code>, o súbela a GitHub Pages.</p></div>';
</script>
<script type="module" src="js/app.js"></script>
