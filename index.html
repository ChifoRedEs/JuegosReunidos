<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JugamiGO</title>
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<!-- Fuentes: se cargan sin bloquear el primer pintado (mientras llegan se usa la del sistema) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Chewy&family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Nunito:wght@500;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Chewy&family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Nunito:wght@500;700;800&display=swap"></noscript>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/marca.css">
<link rel="stylesheet" href="css/pasaporte.css">
</head>
<body>
<div id="splash" aria-hidden="true"><div class="sp-sello"><img src="img/marca/sello.webp" alt="" width="132" height="132"><b>GO</b></div><p class="sp-n">Jugami<span>GO</span></p><p class="sp-l">60 juegos · también sin conexión</p></div>
<script>try { if (sessionStorage.getItem('jr2:splash')) document.getElementById('splash').remove(); else sessionStorage.setItem('jr2:splash', '1'); } catch (e) { /* sin sessionStorage: se muestra siempre */ }</script>
<header class="top">
  <h1 id="titulo"><span id="titulotxt">Jugami<span class="go">GO</span></span></h1>
  <nav id="nav" aria-label="Navegación principal"></nav>
</header>
<main id="app"></main>

<noscript><p style="padding:16px">JugamiGO necesita JavaScript.</p></noscript>
<script>
  // Los módulos JS no se cargan desde file:// (doble clic). Aviso claro en vez de pantalla en blanco.
  if (location.protocol === 'file:') document.getElementById('app').innerHTML =
    '<div style="padding:8px"><h2>Abre la app con un servidor</h2><p>Los módulos de JavaScript no funcionan al abrir index.html con doble clic.</p>' +
    '<p>En esta carpeta ejecuta <code>python -m http.server</code> y entra en <code>http://localhost:8000</code>, o súbela a GitHub Pages.</p></div>';
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
